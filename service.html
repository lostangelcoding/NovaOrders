<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Detailed service information and ordering options. Explore pricing and features.">
    <title>NovaOrders</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="shortcut icon" href="/favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="/src/css/main.css">
    <link class="canonical" href="">
</head>
<body class="flex-column" data-page="service">
    <header id="header" class="flex-between">

    </header>

    <main>
        <section id="service-preview" class="service-preview">
            <div id="service" aria-live="polite">

            </div>
            <div class="service-help">
                <p>If you change your mind, <a href="/services.html" class="back-to-services">go back to services</a>.</p>
            </div>
        </section>

        <section class="order-form">
            <form id="service-form" method="post" aria-label="Service inquiry form">
                <input type="hidden" id="selected-service" name="service" value="">
            
                <div class="form-group">
                    <label for="service-name">Name</label>
                    <input type="text" id="service-name" name="name" required placeholder="John Doe" aria-required="true">
                </div>

                <div class="form-group">
                    <label for="service-email">Email</label>
                    <input type="email" id="service-email" name="email" required placeholder="john@example.com" aria-required="true">
                </div>
            
                <div class="form-group">
                    <label for="service-message">Message</label>
                    <textarea id="service-message" name="message" required placeholder="Describe your project scope..." aria-required="true"></textarea>
                </div>

                <div class="form-group-honey" aria-hidden="true">
                    <label for="contact-nickname" class="honey-label">Leave this field blank</label>
                    <input type="text" id="contact-nickname" name="b_username" autocomplete="off" tabindex="-1" placeholder="Your nickname">
                </div>
            
                <button type="submit" class="cta-button">Send Inquiry</button>
            </form>
        </section>
        <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>
    </main>

    <footer id="footer" class="flex">

    </footer>

    <script type="module" src="/src/js/index.js"></script>
</body>
</html>

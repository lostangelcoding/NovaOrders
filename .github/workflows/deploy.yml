name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies (if present)
        run: |
          if [ -f package.json ]; then
            npm ci
          else
            echo "No package.json — skipping install"
          fi

      - name: Build (if configured)
        run: |
          if [ -f package.json ] && node -e "try{const p=require('./package.json'); process.exit(p.scripts&&p.scripts.build?0:1)}catch(e){process.exit(1)}"; then
            npm run build
          else
            echo "No build script — skipping"
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ./

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v2

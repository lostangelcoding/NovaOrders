<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Get in touch with NovaOrders. Submit your project requirements and request a custom service.">
    <title>NovaOrders - Contact</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="shortcut icon" href="/favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="/src/css/main.css">
    <link class="canonical" href="">
</head>
<body class="flex-column" data-page="contact"> 
    <header id="header" class="flex" role="banner">

    </header>

    <main class="nova-contact-page">
        <h1 class="service-heading">Contact Us</h1>

        <div class="services-preview">
            <form id="contact-order-form" class="contact-form" aria-label="Contact inquiry form">
                <input type="hidden" id="selected-service" name="service" value="General Inquiry">

                <div class="form-group">
                    <label for="contact-name">Your Name</label>
                    <input type="text" id="contact-name" name="name" required placeholder="John Doe" aria-required="true">
                </div>

                <div class="form-group">
                    <label for="contact-email">Email Address</label>
                    <input type="email" id="contact-email" name="email" required placeholder="john@example.com" aria-required="true">
                </div>

                <div class="form-group">
                    <label for="contact-message">Project Description & Requirements</label>
                    <textarea id="contact-message" name="message" rows="6" required placeholder="Describe your project scope..." aria-required="true"></textarea>
                </div>

                <div class="form-group-honey" aria-hidden="true">
                    <label for="contact-nickname" class="honey-label">Leave this field blank</label>
                    <input type="text" id="contact-nickname" name="b_username" autocomplete="off" tabindex="-1" placeholder="Your nickname">
                </div>

                <button type="submit" class="cta-button btn-submit">Send Inquiry</button>
            </form>
        </div>
    </main>

    <footer id="footer" class="flex" role="contentinfo">

    </footer>

    <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>

    <script type="module" src="/src/js/index.js"></script>
</body>
</html>
